[General]
LogLevel=Info

[TextRenderer]
Enabled=1
FontName=Microsoft YaHei
FontSize=16
; 游戏内(8bpp)专用字号：主菜单16bpp用FontSize，游戏内HUD/UI用此值（可调,0则同FontSize）
FontSize8=14
FontWeight=250
AntiAlias=false
TextColor=0xFFFFFF
FgIndex=255
YOffset=0
OutlineColor=0x000000
OutlineWidth=1
; 用 GDI 渲染中文，全量接管字符串迭代器（关键 hook）
EnableStringHook=1
; 修正中文串宽度查询，避免文本重叠/错位
EnableQueryHook=1
; 单字符 hook 会与全量渲染叠加（双重绘制），保持关闭
EnableCharHook=0

[TextReplace]
; 已将翻译直接写入 ini 文件（update/Data_m/），无需运行时替换
Enabled=1
